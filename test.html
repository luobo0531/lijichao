<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>

body{
    margin:0;
    font-family: "Microsoft YaHei", sans-serif;
}

.newmark-banner{
    position: relative;
    padding: 100px 20px 80px;
    text-align: center;
    background: #f8fafc;
    overflow: hidden;
}

.newmark-banner h1{
    font-size: 48px;
    font-weight: 700;
    color: #1f2937;
    margin-bottom: 10px;
}

.subtitle{
    font-size: 16px;
    color: #4b5563;
    margin-top: 20px;
}

/* 曲线 */

.newmark-curve{
    width: 260px;
    margin: 10px auto;
}

.newmark-curve path{
    fill: none;
    stroke: #2563eb;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-dasharray: 6 6;
    animation: newmarkFlow 6s linear infinite;
}

@keyframes newmarkFlow{
    from{
        stroke-dashoffset:0;
    }
    to{
        stroke-dashoffset:-60;
    }
}

/* 淡公式背景 */

.formula-bg{
    position: absolute;
    top: 40px;
    left: 50%;
    transform: translateX(-50%);
    font-family: serif;
    font-size: 40px;
    color: rgba(0,0,0,0.05);
    white-space: nowrap;
}

.t-steps{
    position:absolute;
    bottom:20px;
    right:40px;
    font-size:12px;
    color:#9ca3af;
}

</style>

</head>


<body>

<section class="newmark-banner">

<div class="formula-bg">
Mü + Cū + Ku = F(t) &nbsp;&nbsp;&nbsp; β = 1/4 &nbsp;&nbsp;&nbsp; γ = 1/2
</div>

<h1>科研 Newmark</h1>

<svg class="newmark-curve" viewBox="0 0 600 80">
<path d="M0 40 
         C80 10, 120 70, 200 40
         S320 10, 400 40
         S520 70, 600 40" />
</svg>

<p class="subtitle">
作为一名从事工程抗震研究的科研牛马（Newmark），谨以谐音梗致敬 Newmark-β 法。
</p>

<div class="t-steps">
t₀ → t₁ → t₂
</div>

</section>

</body>
</html>
