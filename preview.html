<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站预览</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        .preview-section {
            margin-bottom: 40px;
        }
        .preview-section h2 {
            color: #555;
            margin-bottom: 10px;
        }
        .preview-link {
            display: block;
            margin: 10px 0;
            padding: 10px 15px;
            background-color: #1a73e8;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        .preview-link:hover {
            background-color: #1557b0;
        }
        .info {
            background-color: #f0f0f0;
            padding: 15px;
            border-radius: 4px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>网站预览</h1>
        
        <div class="preview-section">
            <h2>网站文件</h2>
            <a href="index.html" class="preview-link" target="_blank">打开网站首页</a>
        </div>
        
        <div class="info">
            <h2>修改说明</h2>
            <ul>
                <li>所有大标题和小标题的字号都调大了3个字号</li>
                <li>大标题和小标题之间的距离改宽了</li>
                <li>小标题之间的距离改窄了</li>
                <li>侧边栏导航的字体大小和间距也相应调整</li>
            </ul>
        </div>
    </div>
</body>
</html>
